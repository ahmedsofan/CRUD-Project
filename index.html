<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Project</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">CRUD Project</h1>
        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h3 class="mb-0"><i class="bi bi-journal-text fs-3"></i> إدارة المقالات</h3>
            </div>

            <div class="card-body">
                <form id="articleForm">

                    <div class="mb-3">
                        <label for="title" class="form-label">عنوان المقال</label>
                        <input type="text" class="form-control" id="title" placeholder="أدخل عنوان المقال" required>
                    </div>

                    <div class="mb-3">
                        <label for="content" class="form-label">محتوى المقال</label>
                        <textarea class="form-control" id="content" rows="5" placeholder="أدخل محتوى المقال"
                            required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <h4 class="text-center"><i class="bi bi-plus-circle"></i> إضافة المقال</h4>
                    </button>
                </form>
                <hr>
                <div id="articlesList" class="list-group mt-4">
                    <!-- Articles will be dynamically added here -->
                </div>
            </div>

        </div>
        <!---- Bootstrap Modal ---->
        <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="3" dir="rtl">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editModalLabel">تعديل المقال</h5>
                        <button type="button" class="btn-close ms-0 me-auto" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editId"> <!-- عشان نحدد المقالة اللي هتتعدل بالظبط -->
                        <form id="editForm">
                            <div class="mb-3">
                                <label for="editTitle" class="form-label">العنوان</label>
                                <input type="text" class="form-control" id="editTitle" required>
                            </div>
                            <div class="mb-3">
                                <label for="editContent" class="form-label">المحتوى</label>
                                <textarea id="editContent" class="form-control" rows="4" required></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                        <button type="button" class="btn btn-primary" id="saveChanges">حفظ التغييرات</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>

</html>
